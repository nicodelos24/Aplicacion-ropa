<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ropa v2 — Catálogo de Ventas</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="src/main.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="toprow">
      <div>
        <div class="brand">Ropa<span>.</span></div>
        <div class="sub" id="subtitle"></div>
      </div>
      <button class="theme-btn tocable" id="themeBtn" aria-label="Cambiar tema"></button>
    </div>
    <div class="stats" id="stats" style="max-width:560px;margin:12px auto 0"></div>
    <div id="tools" style="max-width:560px;margin:0 auto">
      <div class="buscar" id="searchrow" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/></svg>
        <input id="search" placeholder="Buscar…" inputmode="search" aria-label="Buscar">
      </div>
      <div class="chips" id="chips" style="display:none"></div>
    </div>
  </header>

  <main id="main" class="vista"></main>

  <button class="fab" id="fab" aria-label="Agregar"></button>

  <nav id="nav" aria-label="Secciones">
    <button data-v="inicio" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Inicio</button>
    <button data-v="agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4m8-4v4"/></svg>Agenda</button>
    <button data-v="pedidos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18l-1.5 12h-15L3 6z"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Pedidos</button>
    <button data-v="inventario">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v9"/></svg>Inventario</button>
    <button data-v="contactos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><path d="M17 8.5a3 3 0 1 1 .5 5.9M17.5 14.5c2.6.3 4 2 4 4.5"/></svg>Contactos</button>
    <button data-v="historial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>Historial</button>
    <button data-v="ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10l2.1 2.1M19.1 4.9L17 7m-10 10l-2.1 2.1"/></svg>Ajustes</button>
  </nav>

  <div class="hoja" id="hoja"><div class="hoja-in" id="hoja-in" role="dialog" aria-modal="true" aria-label="Hoja"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="cov" id="confirmar">
    <div class="cbox" role="alertdialog" aria-modal="true" aria-labelledby="cv-t" aria-describedby="cv-p">
      <div class="cic"></div>
      <h3 id="cv-t"></h3>
      <p id="cv-p"></p>
      <div class="crow">
        <button class="cbtn-no" id="cv-no">Cancelar</button>
        <button class="cbtn-yes" id="cv-yes">Aceptar</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
