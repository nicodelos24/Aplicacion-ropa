<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ropa v2 — Catálogo de Ventas</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="src/main.css?v=9">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="toprow">
      <div>
        <div class="brand">Ropa<span>.</span></div>
        <div class="sub" id="subtitle"></div>
      </div>
      <button class="theme-btn tocable" id="themeBtn" aria-label="Cambiar tema"></button>
    </div>
    <div class="stats" id="stats"></div>
    <div id="tools">
      <div class="buscar" id="searchrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/></svg>
        <input id="search" placeholder="Buscar…" inputmode="search" aria-label="Buscar">
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <!-- Aviso de guardado (persistencia degradada): lo pinta main.js. Arranca
       oculto y sin alto; vive en el flujo, así que no tapa el contenido. -->
  <div class="aviso-disco" id="aviso-disco" role="status" aria-live="polite" hidden>
    <div class="aviso-disco-in">
      <span class="aviso-disco-ico" id="aviso-disco-ico" aria-hidden="true"></span>
      <div class="aviso-disco-txt">
        <b id="aviso-disco-titulo"></b>
        <p id="aviso-disco-texto"></p>
      </div>
      <button class="aviso-disco-x" id="aviso-disco-x" aria-label="Cerrar aviso"></button>
    </div>
  </div>

  <main id="main" class="vista"></main>

  <button class="fab" id="fab" aria-label="Agregar"></button>

  <nav id="nav" aria-label="Secciones">
    <button data-v="inicio" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10.2V20h4.6v-5.2h3.8V20h4.6v-9.8"/></svg>
      <span class="nav-lbl">Inicio</span></button>
    <button data-v="agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="4.8" width="17.6" height="16" rx="3.2"/><path d="M3.2 9.6h17.6M8.2 2.8v3.6m7.6-3.6v3.6"/></svg>
      <span class="nav-lbl">Agenda</span></button>
    <button data-v="pedidos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 7.6h14.8l-1.2 12.2H5.8L4.6 7.6z"/><path d="M8.8 7.6V6a3.2 3.2 0 0 1 6.4 0v1.6"/></svg>
      <span class="nav-lbl">Pedidos</span></button>
    <button data-v="inventario">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 8.2 12 3.6 3.4 8.2v7.6l8.6 4.6 8.6-4.6V8.2z"/><path d="M3.4 8.2 12 12.8l8.6-4.6M12 12.8v7.6"/></svg>
      <span class="nav-lbl">Inventario</span></button>
    <button data-v="contactos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.4" cy="8.4" r="3.4"/><path d="M3 19.6c0-3.4 2.9-5.4 6.4-5.4s6.4 2 6.4 5.4"/><path d="M16.8 5.6a3 3 0 0 1 .4 5.7M17.6 14.4c2.4.4 3.6 2 3.6 4.4"/></svg>
      <span class="nav-lbl">Contactos</span></button>
    <button data-v="historial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 12a8.6 8.6 0 1 0 2.9-6.4"/><path d="M3.4 4.4v4.8h4.8"/><path d="M12 8.2V12l2.8 1.9"/></svg>
      <span class="nav-lbl">Historial</span></button>
    <button data-v="ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.6 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.3.6z"/></svg>
      <span class="nav-lbl">Ajustes</span></button>
  </nav>

  <div class="hoja" id="hoja"><div class="hoja-in" id="hoja-in" role="dialog" aria-modal="true" aria-label="Hoja"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="cov" id="confirmar">
    <div class="cbox" role="alertdialog" aria-modal="true" aria-labelledby="cv-t" aria-describedby="cv-p">
      <div class="cic"></div>
      <h3 id="cv-t"></h3>
      <p id="cv-p"></p>
      <div class="crow">
        <button class="cbtn-no" id="cv-no">Cancelar</button>
        <button class="cbtn-yes" id="cv-yes">Aceptar</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
